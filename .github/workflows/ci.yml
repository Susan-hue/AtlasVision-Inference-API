name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      # Validates docker-compose.prod.yml and the GPU Dockerfile without building it.
      - name: Check production config
        run: |
          printf 'API_KEYS=ci\nREDIS_PASSWORD=ci\n' > .env
          printf 'HF_TOKEN=ci\n' > .env.worker
          docker compose -f docker-compose.prod.yml config --quiet
          docker build --check -f docker/worker.Dockerfile --target gpu .

      - name: Stop containers
        if: always()
        run: docker compose --profile test down --volumes
