[project]
name = "atlasvision-api"
version = "0.1.0"
description = "Job-queue inference API around the testatlasvision SDK"
requires-python = ">=3.11,<3.12"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # bugbear
    "ASYNC",    # blocking calls inside async code
    "SIM",      # simplifications
    "RUF",      # ruff-specific
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    # Starlette's TestClient warns when using httpx instead of httpx2; we stay on httpx.
    'ignore:^Using `httpx` with `starlette\.testclient` is deprecated; install `httpx2` instead\.$:starlette.exceptions.StarletteDeprecationWarning',
    # arq's Worker.close() calls redis-py's deprecated close().
    'ignore:^Call to deprecated close\. \(Use aclose\(\) instead\):DeprecationWarning:arq\.worker',
]
