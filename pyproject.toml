[project]
name = "atlasvision-api"
version = "0.1.0"
description = "Job-queue inference API around the testatlasvision SDK"
requires-python = ">=3.11,<3.12"
# Runtime dependencies live in requirements/*.in (one set per image), not here,
# because the API and worker images must install different things.

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # bugbear
    "ASYNC",    # blocking calls inside async code
    "SIM",      # simplifications
    "RUF",      # ruff-specific
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
